# The anonymous JSON views of the store. Both are served only at a site's modules-repository folder: the
# pathPattern (a regular expression matched against the whole node path) keeps the grant there instead of
# opening the views on every content folder of the repository (JSTORE-SEC-005). It must contain no comma
# and no space: the security filter splits the value on both.
access-jahia-store-json-views:
  auto_apply:
    - always: true
  grants:
    - api: view.json.moduleList
      node:
        nodeType: jnt:contentFolder
        pathPattern: /sites/[^/]+/contents/modules-repository
    # securityUpdates.json, read by Jahia instances (see README "Security updates feed"). Without this
    # grant the security filter answers 404 and the view never runs.
    - api: view.json.securityUpdates
      node:
        nodeType: jnt:contentFolder
        pathPattern: /sites/[^/]+/contents/modules-repository
