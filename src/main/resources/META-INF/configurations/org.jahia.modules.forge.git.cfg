# default configuration - won't be overridden
#
# Private App Store - git-backed modules (docs/git-backed-modules.md).
# The store reads a registered repository through a bare clone it keeps on disk.

# Directory under which each repository keeps its clone. Empty = <jahia data dir>/forge-git.
cacheDir=

# How long a reading of a repository stays current, in seconds. A read of a module older than
# this lists the remote tags again. 0 reads the remote on every request.
refreshSeconds=300

# The regular expression a tag must match to be a version, for a registration that names none.
# The default accepts 1.2.3 and v1.2.3, and no pre-release suffix.
tagPattern=^v?\\d+\\.\\d+\\.\\d+$
