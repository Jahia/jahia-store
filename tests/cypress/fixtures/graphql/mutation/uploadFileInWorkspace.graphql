# Same as the @jahia/cypress uploadFile mutation, but with the workspace as a variable: 34-mediaMimeGuardLive
# uploads straight into LIVE, the way the store front-end writes media (JSTORE-SEC-012).
mutation UploadFileInWorkspace(
    $workspace: Workspace!
    $parentPathOrId: String!
    $name: String!
    $mimeType: String!
    $file: String!
) {
    jcr(workspace: $workspace) {
        addNode(name: $name, parentPathOrId: $parentPathOrId, primaryNodeType: "jnt:file") {
            addChild(name: "jcr:content", primaryNodeType: "jnt:resource") {
                content: mutateProperty(name: "jcr:data") {
                    setValue(type: BINARY, value: $file)
                }
                contentType: mutateProperty(name: "jcr:mimeType") {
                    setValue(value: $mimeType)
                }
            }
            uuid
        }
    }
}
